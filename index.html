<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>osapiens · Workplace M&D</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --g9:#064E3B;--g8:#065F46;--g7:#047857;--g6:#059669;--g5:#10B981;
  --g2:#A7F3D0;--g1:#D1FAE5;--g0:#ECFDF5;
  --border:#e5e5ea;--bg:#f5f5f7;--card:#fff;--txt:#1d1d1f;--txt2:#636366;
  --r:10px;--sh:0 1px 4px rgba(0,0,0,.08);
  --high:#C0392B;--hbg:#FFE8E8;--med:#9C6B00;--mbg:#FFF2CC;--low:#375623;--lbg:#E2EFDA;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);}
button{cursor:pointer;font-family:inherit;}
input,textarea,select{font-family:inherit;}

/* Error boundary */
.err-screen{padding:40px;max-width:700px;margin:40px auto;}
.err-screen h2{color:var(--high);margin-bottom:12px;}
.err-screen pre{background:#f5f5f7;border:1px solid var(--border);border-radius:8px;padding:16px;font-size:12px;overflow:auto;white-space:pre-wrap;}

/* Password */
.pw{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--g9);}
.pw-card{background:#fff;border-radius:16px;padding:40px 48px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.pw-brand{font-size:11px;font-weight:800;color:var(--g7);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.pw-title{font-size:20px;font-weight:700;margin-bottom:6px;}
.pw-sub{font-size:13px;color:var(--txt2);margin-bottom:24px;}
.pw-inp{width:100%;border:2px solid var(--border);border-radius:10px;padding:11px;font-size:15px;outline:none;text-align:center;letter-spacing:2px;}
.pw-inp:focus{border-color:var(--g5);}
.pw-btn{width:100%;margin-top:12px;background:var(--g7);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;}
.pw-btn:hover{background:var(--g8);}
.pw-err{margin-top:8px;font-size:12px;color:var(--high);}

/* Layout */
.layout{display:flex;height:100vh;overflow:hidden;}
.sb{width:250px;background:var(--g9);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:28px 32px;}

/* Sidebar */
.sb-hdr{padding:16px;border-bottom:1px solid rgba(255,255,255,.1);}
.sb-brand{font-size:11px;font-weight:800;color:var(--g2);letter-spacing:1.5px;text-transform:uppercase;}
.sb-title{font-size:13px;font-weight:700;color:#fff;margin-top:3px;line-height:1.3;}
.sb-user{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.sb-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;padding:12px 16px 4px;}
.sb-row{display:flex;align-items:center;padding:7px 16px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.75);gap:7px;transition:background .12s;}
.sb-row:hover{background:rgba(255,255,255,.08);}
.sb-row.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600;}
.sb-row.sub{padding-left:28px;font-size:12.5px;}
.sb-row-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-cnt{background:rgba(255,255,255,.12);border-radius:10px;font-size:10px;padding:1px 6px;color:rgba(255,255,255,.6);}
.sb-par{display:flex;align-items:center;padding:8px 16px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.9);font-weight:600;gap:7px;transition:background .12s;}
.sb-par:hover{background:rgba(255,255,255,.08);}
.sb-chev{font-size:10px;transition:transform .2s;color:rgba(255,255,255,.4);margin-left:auto;}
.sb-chev.open{transform:rotate(90deg);}
.sb-mv{border:none;background:none;color:rgba(255,255,255,.3);font-size:11px;padding:1px 3px;line-height:1;flex-shrink:0;}
.sb-mv:hover{color:rgba(255,255,255,.8);}
.sb-mv:disabled{opacity:.2;cursor:default;}
.sb-new{display:flex;align-items:center;justify-content:center;gap:5px;margin:8px 16px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border:1px dashed rgba(255,255,255,.25);border-radius:8px;padding:7px;font-size:12px;font-weight:600;}
.sb-new:hover{background:rgba(255,255,255,.18);color:#fff;}
.sb-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);margin-top:auto;}
.sb-lock{width:100%;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:none;border-radius:8px;padding:7px;font-size:12px;}
.sb-lock:hover{background:rgba(255,255,255,.15);color:#fff;}

/* Topbar */
.tb-bc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt2);flex:1;min-width:0;}
.tb-crumb{cursor:pointer;white-space:nowrap;}
.tb-crumb:hover{color:var(--g7);text-decoration:underline;}
.tb-cur{color:var(--txt);font-weight:600;cursor:default;}
.tb-sep{color:var(--border);}
.tb-srch{position:relative;}
.tb-srch input{border:1px solid var(--border);border-radius:20px;padding:5px 13px 5px 30px;font-size:13px;background:var(--bg);outline:none;width:175px;}
.tb-srch input:focus{border-color:var(--g5);background:#fff;}
.tb-si{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--txt2);pointer-events:none;}
.btn{border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;background:#fff;color:var(--txt);}
.btn:hover{border-color:var(--g6);color:var(--g7);}
.btn-p{background:var(--g7);color:#fff;border-color:var(--g7);}
.btn-p:hover{background:var(--g8);}
.btn-edit{background:var(--g1);color:var(--g8);border-color:var(--g5);}
.btn-sm{padding:3px 9px;font-size:11px;border-radius:6px;}
.btn-d{border-color:#fca5a5;color:var(--high);background:#fff;}
.btn-d:hover{background:var(--hbg);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* Badges */
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.b-high{background:var(--hbg);color:var(--high);}
.b-med{background:var(--mbg);color:var(--med);}
.b-low{background:var(--lbg);color:var(--low);}
.b-ip{background:#EAF4FF;color:#007AFF;}
.b-done{background:#E8F8EF;color:#1A7F3C;}
.b-ns{background:#F5F5F7;color:#636366;}
.b-bl{background:var(--hbg);color:var(--high);}
.b-mo{background:var(--mbg);color:var(--med);}

/* Modal */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:#fff;border-radius:12px;max-width:650px;width:90%;max-height:90vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal h3{font-size:18px;font-weight:700;margin-bottom:16px;}
.mrow{margin-bottom:14px;}
.mrow label{display:block;font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.mrow input,.mrow textarea,.mrow select{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:13px;outline:none;}
.mrow input:focus,.mrow textarea:focus,.mrow select:focus{border-color:var(--g5);background:var(--g0);}
.mrow input.err,.mrow textarea.err,.mrow select.err{border-color:var(--high);background:#ffe8e8;}
.mrow textarea{resize:vertical;min-height:60px;font-family:inherit;}
.mfoot{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;}

/* Date picker */
.date-input-wrapper{position:relative;}
.date-input-wrapper input[type="date"]{width:100%;}
.date-input-wrapper input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;border-radius:4px;margin-right:4px;opacity:.6;}
.date-input-wrapper input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1;}

/* Validation */
.validation-msg{font-size:11px;color:var(--high);margin-top:4px;display:flex;align-items:center;gap:4px;}

/* Email templates editor */
.tmpl-editor{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:14px;}
.tmpl-tabs{display:flex;gap:8px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px;}
.tmpl-tab{padding:6px 12px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--txt2);border-bottom:2px solid transparent;transition:all .2s;}
.tmpl-tab.active{color:var(--g7);border-bottom-color:var(--g7);}
.tmpl-field{margin-bottom:12px;}
.tmpl-field label{display:block;font-size:10px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.tmpl-field textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px;font-family:monospace;resize:vertical;min-height:50px;}
.tmpl-field textarea:focus{border-color:var(--g5);outline:none;}

/* Email preview */
.tmpl-preview{background:#fafafa;border:1px solid var(--border);border-radius:6px;padding:12px;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-top:8px;max-height:150px;overflow-y:auto;}

/* Blocks */
.blk{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;}
.blk-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.blk-hdr h3{flex:1;font-size:15px;font-weight:700;}
.blk-mv{border:none;background:none;color:var(--txt2);cursor:pointer;font-size:11px;padding:3px 6px;}
.blk-mv:hover:not(:disabled){color:var(--g7);}
.blk-mv:disabled{opacity:.3;cursor:not-allowed;}
.blk-hide{border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;background:#fff;cursor:pointer;}
.blk-hide:hover{border-color:var(--g7);color:var(--g7);}

/* Value management */
.val-mgmt{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:14px;}
.val-mgmt-title{font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;margin-bottom:10px;}
.val-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.val-badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;}
.val-badge-close{cursor:pointer;color:var(--txt2);font-size:14px;line-height:1;}
.val-badge-close:hover{color:var(--high);}
.val-add{display:flex;gap:6px;}
.val-add input{flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;}
.val-add input:focus{border-color:var(--g5);outline:none;}
.val-add button{padding:6px 12px;font-size:11px;white-space:nowrap;}

/* Tasks & Goals */
.gr{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.cb{width:18px;height:18px;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;flex-shrink:0;margin-top:1px;transition:all .2s;}
.cb:hover{border-color:var(--g5);background:var(--g0);}
.cb.chk{background:var(--g7);border-color:var(--g7);position:relative;}
.cb.chk::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:12px;font-weight:700;}
.g-inp{border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:13px;flex:1;}
.g-inp:focus{border-color:var(--g5);outline:none;}
.g-txt{color:var(--txt);line-height:1.4;}
.g-txt.done{text-decoration:line-through;color:var(--txt2);}
.ix{border:none;background:none;color:var(--txt2);cursor:pointer;font-size:14px;padding:0;line-height:1;}
.ix:hover{color:var(--high);}

.add-btn{border:1px dashed var(--border);background:none;color:var(--txt2);border-radius:6px;padding:8px 12px;font-size:12px;cursor:pointer;width:100%;margin-top:8px;}
.add-btn:hover{border-color:var(--g5);color:var(--g7);background:var(--g0);}

/* Task list */
.task-li{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:all .12s;}
.task-li:hover{border-color:var(--g5);background:#fff;}
.task-body{flex:1;min-width:0;}
.task-txt{font-size:13px;color:var(--txt);margin-bottom:4px;word-break:break-word;}
.task-txt.done{text-decoration:line-through;color:var(--txt2);}
.task-pills{display:flex;flex-wrap:wrap;gap:4px;}
.tpill{background:var(--border);color:var(--txt2);border-radius:4px;padding:2px 6px;font-size:11px;white-space:nowrap;}
.tpill-h{background:var(--mbg);color:var(--med);}

/* Team table */
.tm{width:100%;border-collapse:collapse;}
.tm tr{border-bottom:1px solid var(--border);}
.tm td{padding:8px 0;vertical-align:top;}
.tm-n{width:50%;padding-right:12px;}
.tm-r{width:50%;padding-left:12px;}
.tm-inp{width:100%;border:1px solid var(--border);border-radius:4px;padding:6px;font-size:12px;}
.tm-inp:focus{border-color:var(--g5);outline:none;}

/* Connections */
.conn-list{display:flex;flex-wrap:wrap;gap:6px;}
.conn-chip{display:inline-flex;align-items:center;gap:6px;background:var(--g0);border:1px solid var(--g2);border-radius:20px;padding:6px 10px;font-size:12px;}
.lnk{color:var(--g7);cursor:pointer;text-decoration:none;}
.lnk:hover{text-decoration:underline;}
.conn-rm{border:none;background:none;color:var(--txt2);cursor:pointer;font-size:12px;padding:0;line-height:1;}
.conn-rm:hover{color:var(--high);}
.conn-sel{padding:6px;font-size:12px;border:1px solid var(--border);border-radius:4px;}

/* Statuses & overviews */
.isel{border:1px solid var(--border);border-radius:6px;padding:6px;font-size:12px;cursor:pointer;outline:none;}
.isel:focus{border-color:var(--g5);}
.isel-ip{border-color:var(--b-ip);}
.isel-done{border-color:var(--low);}
.isel-bl{border-color:var(--high);}
.isel-mo{border-color:var(--med);}
.empty{color:var(--txt2);font-style:italic;font-size:12px;}

/* Hub view */
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
.hub.list{display:flex;flex-direction:column;gap:8px;}
.proj-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .12s;}
.hub.list .proj-card{display:grid;grid-template-columns:1fr auto;align-items:start;gap:16px;padding:12px 16px;}
.proj-card:hover{border-color:var(--g5);box-shadow:0 4px 12px rgba(0,0,0,.08);}
.proj-title{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:8px;}
.hub.list .proj-title{margin-bottom:4px;}
.proj-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:11px;}
.hub.list .proj-meta{flex-wrap:nowrap;gap:8px;}
.proj-desc{font-size:12px;color:var(--txt2);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hub.list .proj-desc{margin-bottom:0;-webkit-line-clamp:1;}

/* Project page */
.proj-hdr{display:grid;grid-template-columns:1fr auto;gap:20px;margin-bottom:24px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;}
.proj-info h2{font-size:24px;font-weight:700;margin-bottom:12px;}
.proj-meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.meta-item{background:var(--bg);border-radius:6px;padding:10px;}
.meta-label{font-size:10px;font-weight:700;color:var(--txt2);text-transform:uppercase;margin-bottom:4px;}
.meta-value{font-size:13px;color:var(--txt);}
.proj-actions{display:flex;flex-direction:column;gap:8px;}

/* Mode selection grid */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0;}
.mode-card{border:2px solid var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;}
.mode-card:hover{border-color:var(--g5);}
.mode-card.sel{border-color:var(--g7);background:var(--g0);}
.mode-icon{font-size:32px;font-weight:700;color:var(--txt2);margin-bottom:8px;}
.mode-ttl{font-size:13px;font-weight:700;margin-bottom:4px;}
.mode-desc{font-size:11px;color:var(--txt2);}

/* Block checkboxes */
.blk-chks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.blk-chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;}
.blk-chk input{cursor:pointer;}

/* Attachment */
.att-row{display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg);border-radius:6px;margin-bottom:6px;}
.att-lnk{color:var(--g7);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.att-lnk:hover{text-decoration:underline;}
.att-add{display:flex;gap:6px;margin-top:6px;}
.att-add input{flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;}
.att-add input:focus{border-color:var(--g5);outline:none;}

.rem-btn{width:100%;background:var(--g0);border:1px solid var(--g2);color:var(--g8);border-radius:6px;padding:10px;font-size:12px;font-weight:600;cursor:pointer;margin:12px 0;}
.rem-btn:hover{background:var(--g1);}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel">
const {useState, useEffect, useRef}=React;

const SK='wmd-v4-fixed';

// ── Parent sections with location mapping ────────────────────
const PARENTS=[
  {id:'madrid',label:'Madrid',emoji:'🇪🇸',bannerColor:'#065F46',description:'Spain office',location:'Madrid'},
  {id:'munchen',label:'München',emoji:'🇩🇪',bannerColor:'#059669',description:'Munich office',location:'München'},
  {id:'mannheim',label:'Mannheim',emoji:'🇩🇪',bannerColor:'#10B981',description:'Mannheim office',location:'Mannheim'},
  {id:'cross',label:'Cross-Location',emoji:'🌍',bannerColor:'#6EE7B7',description:'Cross-location',location:'Cross'},
  {id:'dev',label:'Development',emoji:'📈',bannerColor:'#A7F3D0',description:'Personal development',location:'Cross'}
];

const S_OPTS=['Not Started','In Progress','Done','Blocked','Monitor'];
const C_OPTS=['Space','Operations','People','Finance','Tools & Processes'];
const P_OPTS=['High','Medium','Low'];
const L_OPTS=['Madrid','München','Mannheim','Cross'];

// Map parents to locations
const getParentLocation=function(parentId){var p=PARENTS.find(function(x){return x.id===parentId;});return p?p.location:'Cross';};
const getParentByLocation=function(location){var p=PARENTS.find(function(x){return x.location===location;});return p?p.id:'cross';};

const BLK_DEFS=[
  {id:'overview',label:'📋 Overview'},
  {id:'goals',label:'🎯 Goals'},
  {id:'tasks',label:'✅ Tasks & Deliverables'},
  {id:'team',label:'👥 Team'},
  {id:'connections',label:'🔗 Connected Projects'},
  {id:'notes',label:'📝 Notes & Context'},
  {id:'attachments',label:'📎 Attachments & Links'},
];

const EMAIL_TEMPLATES={
  reminder:{subject:'Reminder: {task}',body:'Hi {owner},\n\nA friendly reminder about your task:\n\n"{task}"\n\nDue: {due}\n\nBest,\nAnaïs'},
  urgent:{subject:'URGENT: {task}',body:'Hi {owner},\n\nThis needs immediate attention:\n\n"{task}"\n\nDue: {due}\n\nPlease prioritize.\n\nAnaïs'},
  update:{subject:'Status Update: {task}',body:'Hi {owner},\n\nPlease provide a status update on:\n\n"{task}"\n\nExpected completion: {due}\n\nThanks,\nAnaïs'}
};

const defBlocks=function(){return BLK_DEFS.map(function(b){return Object.assign({},b,{visible:true});});};
const mkG=function(t){return{text:t,done:false};};
const mkT=function(id,text,owner,due){return{id:id,text:text,owner:owner,due:due,done:false,notes:'',links:[],emailClient:'generic',emailTemplate:'reminder',emailRecipient:''};};

function scls(s){var m={'In Progress':'ip','Not Started':'ns','Done':'done','Blocked':'bl','Monitor':'mo'};return m[s]||'ns';}
function pcls(p){var m={High:'high',Medium:'med',Low:'low'};return m[p]||'low';}

// ── Error Boundary ────────────────────────────────────────
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err){
      return React.createElement('div',{className:'err-screen'},
        React.createElement('h2',null,'Something went wrong'),
        React.createElement('p',{style:{marginBottom:12,fontSize:14}},String(this.state.err.message)),
        React.createElement('pre',null,String(this.state.err.stack||''))
      );
    }
    return this.props.children;
  }
}

// ── Email Templates ────────────────────────────────────────
function renderEmailTemplate(tmpl, task) {
  if (!tmpl || !EMAIL_TEMPLATES[tmpl]) return '';
  var t = EMAIL_TEMPLATES[tmpl];
  var taskLink='(task: '+task.id+')';
  var bod = t.body
    .replace(/{owner}/g, task.owner || '')
    .replace(/{task}/g, task.text)
    .replace(/{due}/g, task.due || 'TBD');
  return bod+'\n\n'+taskLink;
}

// ── Values Management Modal ────────────────────────────────
function ValuesModal(props){
  var onClose=props.onClose; var projects=props.projects;
  var customCats=props.customCats; var setCustomCats=props.setCustomCats;
  var customPris=props.customPris; var setCustomPris=props.setCustomPris;
  var customLocs=props.customLocs; var setCustomLocs=props.setCustomLocs;
  var [tab,setTab]=useState('categories');
  var [deleteVal,setDeleteVal]=useState(null);
  var [reassignTo,setReassignTo]=useState('');

  function getProjectsUsingValue(field, value){
    return projects.filter(function(p){return p[field]===value;});
  }

  function handleDelete(field, value){
    var usingProjects=getProjectsUsingValue(field, value);
    if(usingProjects.length>0&&!reassignTo){return;}

    if(reassignTo){
      projects.forEach(function(p){if(p[field]===value)p[field]=reassignTo;});
    }

    if(field==='category')setCustomCats(customCats.filter(function(c){return c!==value;}));
    else if(field==='priority')setCustomPris(customPris.filter(function(p){return p!==value;}));
    else if(field==='location')setCustomLocs(customLocs.filter(function(l){return l!==value;}));

    setDeleteVal(null);
    setReassignTo('');
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={function(e){e.stopPropagation();}}>
        <h3>Manage Custom Values</h3>
        <div className="tmpl-tabs" style={{borderBottom:'1px solid var(--border)',paddingBottom:12,marginBottom:12}}>
          {['categories','priorities','locations'].map(function(t){
            return <button key={t} className={`tmpl-tab${tab===t?' active':''}`} onClick={function(){setTab(t);setDeleteVal(null);}}>{t.charAt(0).toUpperCase()+t.slice(1)}</button>;
          })}
        </div>

        {tab==='categories'&&<div>
          {customCats.length===0?<div className="empty">No custom categories</div>:
            <div>
              {customCats.map(function(c){
                var using=getProjectsUsingValue('category',c);
                return (
                  <div key={c} style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:6,padding:10,marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:700}}>{c}</div>
                      {using.length>0&&<div style={{fontSize:11,color:'var(--txt2)',marginTop:2}}>{using.length} project{using.length!==1?'s':''}</div>}
                    </div>
                    <button className="btn btn-sm btn-d" onClick={function(){setDeleteVal({field:'category',value:c});setReassignTo('');}}>Delete</button>
                  </div>
                );
              })}
            </div>
          }
        </div>}

        {tab==='priorities'&&<div>
          {customPris.length===0?<div className="empty">No custom priorities</div>:
            <div>
              {customPris.map(function(p){
                var using=getProjectsUsingValue('priority',p);
                return (
                  <div key={p} style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:6,padding:10,marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:700}}>{p}</div>
                      {using.length>0&&<div style={{fontSize:11,color:'var(--txt2)',marginTop:2}}>{using.length} project{using.length!==1?'s':''}</div>}
                    </div>
                    <button className="btn btn-sm btn-d" onClick={function(){setDeleteVal({field:'priority',value:p});setReassignTo('');}}>Delete</button>
                  </div>
                );
              })}
            </div>
          }
        </div>}

        {tab==='locations'&&<div>
          {customLocs.length===0?<div className="empty">No custom locations</div>:
            <div>
              {customLocs.map(function(l){
                var using=getProjectsUsingValue('location',l);
                return (
                  <div key={l} style={{background:'var(--bg)',border:'1px solid var(--border)',borderRadius:6,padding:10,marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:700}}>{l}</div>
                      {using.length>0&&<div style={{fontSize:11,color:'var(--txt2)',marginTop:2}}>{using.length} project{using.length!==1?'s':''}</div>}
                    </div>
                    <button className="btn btn-sm btn-d" onClick={function(){setDeleteVal({field:'location',value:l});setReassignTo('');}}>Delete</button>
                  </div>
                );
              })}
            </div>
          }
        </div>}

        {deleteVal&&<div style={{background:'var(--hbg)',border:'1px solid var(--border)',borderRadius:6,padding:12,marginTop:16}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>Delete "{deleteVal.value}"?</div>
          {getProjectsUsingValue(deleteVal.field,deleteVal.value).length>0&&<div>
            <div style={{fontSize:11,color:'var(--txt2)',marginBottom:8}}>This value is used by {getProjectsUsingValue(deleteVal.field,deleteVal.value).length} project(s). Reassign to:</div>
            <select value={reassignTo} onChange={function(e){setReassignTo(e.target.value);}} style={{width:'100%',marginBottom:8,padding:6,border:'1px solid var(--border)',borderRadius:4}}>
              <option value="">-- Select a value --</option>
              {(deleteVal.field==='category'?C_OPTS.filter(function(c){return c!==deleteVal.value;}).concat(customCats.filter(function(c){return c!==deleteVal.value;}))
                :deleteVal.field==='priority'?P_OPTS.filter(function(p){return p!==deleteVal.value;}).concat(customPris.filter(function(p){return p!==deleteVal.value;}))
                :L_OPTS.filter(function(l){return l!==deleteVal.value;}).concat(customLocs.filter(function(l){return l!==deleteVal.value;}))).map(function(v){
                return <option key={v} value={v}>{v}</option>;
              })}
            </select>
          </div>}
          <div style={{display:'flex',gap:8}}>
            <button className="btn" onClick={function(){setDeleteVal(null);}}>Cancel</button>
            <button className="btn btn-d" onClick={function(){handleDelete(deleteVal.field,deleteVal.value);}} disabled={getProjectsUsingValue(deleteVal.field,deleteVal.value).length>0&&!reassignTo}>Delete</button>
          </div>
        </div>}

        <div className="mfoot">
          <button className="btn btn-p" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

// ── Task Modal ────────────────────────────────────────────
function TaskModal(props){
  var task=props.task; var editMode=props.editMode; var onSave=props.onSave; var onClose=props.onClose;
  var [f,setF]=useState(Object.assign({},task));
  var [al,setAl]=useState('');
  var [au,setAu]=useState('');
  var [errors,setErrors]=useState({});
  function upd(ch){setF(function(prev){return Object.assign({},prev,ch);});setErrors({});}
  function addLink(){
    if(!au.trim())return;
    upd({links:(f.links||[]).concat([{label:al||au,url:au}])});
    setAl('');setAu('');
  }
  function rmLink(i){upd({links:(f.links||[]).filter(function(_,j){return j!==i;})}); }
  function sendReminder(){
    var recipient=f.emailRecipient||f.owner||'';
    if(!recipient.trim()){setErrors({recipient:'Please enter recipient email'});return;}
    var tmpl=f.emailTemplate||'reminder';
    var t=EMAIL_TEMPLATES[tmpl];
    var subj=encodeURIComponent(t.subject.replace('{task}',f.text));
    var bod=encodeURIComponent(renderEmailTemplate(tmpl, f));
    window.open('mailto:'+recipient+'?subject='+subj+'&body='+bod);
  }
  var preview=renderEmailTemplate(f.emailTemplate||'reminder', f);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={function(e){e.stopPropagation();}}>
        <h3>{editMode?'Edit Task':'Task Details'}</h3>
        <div className="mrow"><label>Task</label>
          {editMode?<textarea rows={3} value={f.text} onChange={function(e){upd({text:e.target.value});}}/>
          :<div style={{fontSize:13,lineHeight:1.5,padding:'6px 0'}}>{f.text}</div>}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="mrow"><label>Owner</label>
            {editMode?<input value={f.owner} onChange={function(e){upd({owner:e.target.value});}} placeholder="Name"/>
            :<div style={{fontSize:13,padding:'6px 0'}}>{f.owner||'-'}</div>}
          </div>
          <div className="mrow"><label>Due Date</label>
            {editMode?<div className="date-input-wrapper"><input type="date" value={f.due} onChange={function(e){upd({due:e.target.value});}}/></div>
            :<div style={{fontSize:13,padding:'6px 0'}}>{f.due||'-'}</div>}
          </div>
        </div>
        <div className="mrow"><label>Notes</label>
          {editMode?<textarea rows={3} value={f.notes||''} onChange={function(e){upd({notes:e.target.value});}} placeholder="Context, blockers, decisions..."/>
          :<div style={{fontSize:13,lineHeight:1.6,whiteSpace:'pre-wrap',padding:'4px 0',color:f.notes?'inherit':'var(--txt2)',fontStyle:f.notes?'normal':'italic'}}>{f.notes||'No notes.'}</div>}
        </div>
        <div className="mrow"><label>Links & Attachments</label>
          {(f.links||[]).length===0&&<div className="empty" style={{marginBottom:6}}>No links yet.</div>}
          {(f.links||[]).map(function(l,i){
            return (
              <div key={i} className="att-row">
                <span>link</span>
                <a className="att-lnk" href={l.url} target="_blank" rel="noreferrer">{l.label}</a>
                {editMode&&<button className="ix" onClick={function(){rmLink(i);}}>x</button>}
              </div>
            );
          })}
          {editMode&&(
            <div className="att-add">
              <input placeholder="Label" value={al} onChange={function(e){setAl(e.target.value);}}/>
              <input placeholder="URL" value={au} onChange={function(e){setAu(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter')addLink();}}/>
              <button className="btn btn-sm btn-p" onClick={addLink}>Add</button>
            </div>
          )}
        </div>
        <div className="mrow"><label>📧 Email Reminder Settings</label>
          {editMode?(<>
            <div style={{marginBottom:10}}>
              <label style={{display:'block',fontSize:11,fontWeight:700,color:'var(--txt2)',marginBottom:4,textTransform:'uppercase'}}>Recipient Email {errors.recipient&&<span className="validation-msg" style={{display:'inline'}}>⚠ {errors.recipient}</span>}</label>
              <input className={errors.recipient?'err':''} value={f.emailRecipient||''} onChange={function(e){upd({emailRecipient:e.target.value});}} placeholder="name@example.com (defaults to owner)"/>
            </div>
            <div style={{marginBottom:10}}>
              <label style={{display:'block',fontSize:11,fontWeight:700,color:'var(--txt2)',marginBottom:4,textTransform:'uppercase'}}>Email Client</label>
              <select value={f.emailClient||'generic'} onChange={function(e){upd({emailClient:e.target.value});}}>
                <option value="generic">Generic (default mail)</option>
                <option value="outlook">Outlook</option>
                <option value="mail">Mac Mail</option>
                <option value="gmail">Gmail</option>
              </select>
            </div>
            <div style={{marginBottom:10}}>
              <label style={{display:'block',fontSize:11,fontWeight:700,color:'var(--txt2)',marginBottom:4,textTransform:'uppercase'}}>Email Template</label>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginBottom:8}}>
                {Object.keys(EMAIL_TEMPLATES).map(function(k){
                  return <div key={k} className={`mode-card${f.emailTemplate===k ? ' sel' : ''}`} onClick={function(){upd({emailTemplate:k});}} style={{padding:'10px'}}>
                    <div style={{fontSize:12,fontWeight:700}}>{k.charAt(0).toUpperCase()+k.slice(1)}</div>
                  </div>;
                })}
              </div>
              <div className="tmpl-preview">{preview}</div>
            </div>
          </>):(<div style={{fontSize:13,padding:'6px 0'}}>
            Client: {f.emailClient||'generic'} | Template: {f.emailTemplate||'reminder'} | Recipient: {f.emailRecipient||f.owner||'owner email'}
          </div>)}
        </div>
        <button className="rem-btn" onClick={sendReminder}>
          📧 Send email reminder
        </button>
        <div className="mfoot">
          <button className="btn" onClick={onClose}>{editMode?'Cancel':'Close'}</button>
          {editMode&&<button className="btn btn-p" onClick={function(){onSave(f);onClose();}}>Save Task</button>}
        </div>
      </div>
    </div>
  );
}

function GoalList(props){

  function edit(i,t){onChange(gs.map(function(g,j){return j===i?Object.assign({},g,{text:t}):g;}));}
  function rm(i){onChange(gs.filter(function(_,j){return j!==i;}));}
  function add(){onChange(gs.concat([{text:'',done:false,isNew:true}]));}

}

  function edit(i,field,val){onChange(team.map(function(m,j){return j===i?Object.assign({},m,{[field]:val}):m;}));}
  function rm(i){onChange(team.filter(function(_,j){return j!==i;}));setNewMemberIndex(-1);}
  function add(){onChange(team.concat([{n:'',r:'',isNew:true}]));setNewMemberIndex(team.length);}
  function finishNew(i){if(team[i].n.trim()&&team[i].r.trim()){onChange(team.map(function(m,j){return j===i?Object.assign({},m,{n:m.n.trim(),r:m.r.trim(),isNew:false}):m;}));setNewMemberIndex(-1);}else if(!team[i].n.trim()&&!team[i].r.trim()){rm(i);}}
  return (
    <div>
      <table className="tm"><tbody>
        {team.map(function(m,i){

              <td className="tm-r">{isEditing?<input className="tm-inp" value={m.r} placeholder="Role" onChange={function(e){edit(i,'r',e.target.value);}} onBlur={function(){if(m.isNew)finishNew(i);}}/>:m.r}</td>

// ── New project modal ─────────────────────────────────────
function NewProjectModal(props){
  var allProjects=props.allProjects; var onClose=props.onClose; var onCreate=props.onCreate;
  var customParents=props.customParents; var setCustomParents=props.setCustomParents;
  var customCats=props.customCats; var setCustomCats=props.setCustomCats;
  var customPris=props.customPris; var setCustomPris=props.setCustomPris;
  var allParents=PARENTS.concat(customParents);
  var [locations, setLocations] = useState(L_OPTS.concat(customParents.map(function(p){return p.location;})));
  var [categories, setCategories] = useState(C_OPTS.concat(customCats));
  var [priorities, setPriorities] = useState(P_OPTS.concat(customPris));
  var [mode,setMode]=useState(null);
  var [title,setTitle]=useState('');
  var [parent,setParent]=useState('madrid');
  var [loc,setLoc]=useState('Madrid');
  var [cat,setCat]=useState('Space');
  var [prio,setPrio]=useState('Medium');
  var [selBlocks,setSelBlocks]=useState(BLK_DEFS.map(function(b){return b.id;}));
  var [newLoc,setNewLoc]=useState('');
  var [newCat,setNewCat]=useState('');
  var [newPri,setNewPri]=useState('');
  var [errors,setErrors]=useState({});

  function toggleBlk(id){setSelBlocks(function(s){return s.indexOf(id)>=0?s.filter(function(x){return x!==id;}):[].concat(s,[id]);});}
  function addNewLoc(){
    if(newLoc.trim()){
      var newParent={
        id:'custom-'+Date.now(),
        label:newLoc,
        emoji:'📍',
        bannerColor:'#6EE7B7',
        description:'Custom location',
        location:newLoc
      };
      setCustomParents([].concat(customParents,[newParent]));
      setLocations([].concat(locations,[newLoc]));
      setLoc(newLoc);
      setParent(newParent.id);
      setNewLoc('');
      setErrors(Object.assign({},errors,{newLoc:''}));
    }
  }
  function addNewCat(){if(newCat.trim()){setCustomCats([].concat(customCats,[newCat]));setCategories([].concat(categories,[newCat]));setCat(newCat);setNewCat('');}}
  function addNewPri(){if(newPri.trim()){setCustomPris([].concat(customPris,[newPri]));setPriorities([].concat(priorities,[newPri]));setPrio(newPri);setNewPri('');}}

  function handleParentChange(pid){
    setParent(pid);
    var newLoc=getParentLocation(pid);
    setLoc(newLoc);
    setErrors({});
  }

  function handleLocationChange(newLoc){
    setLoc(newLoc);
    var newParent=getParentByLocation(newLoc);
    setParent(newParent);
    setErrors({});
  }

  function create(){
    var errs={};
    if(!title.trim())errs.title='Project title is required';
    if(!mode)errs.mode='Please select a structure';
    if(Object.keys(errs).length>0){setErrors(errs);return;}
    var blocks=defBlocks().map(function(b){return Object.assign({},b,{visible:mode==='template'?true:selBlocks.indexOf(b.id)>=0});});
    var newP={id:uid(),title:title.trim(),parent:parent,location:loc,category:cat,owner:'Anaïs',priority:prio,status:'Not Started',deadline:'',overview:'',goals:[],tasks:[],team:[],connections:[],notes:'',attachments:[],blocks:blocks};
    onCreate(newP);onClose();
  }
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={function(e){e.stopPropagation();}}>

        <div className="mrow"><label>Project Title {errors.title&&<span style={{color:'var(--high)',marginLeft:'8px'}}>⚠ {errors.title}</span>}</label>
          <input className={errors.title?'err':''} value={title} onChange={function(e){setTitle(e.target.value);setErrors(Object.assign({},errors,{title:''}));}} placeholder="Enter project name..." autoFocus/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="mrow"><label>Parent Section</label>
            <select value={parent} onChange={function(e){handleParentChange(e.target.value);}}>
              {allParents.map(function(p){return <option key={p.id} value={p.id}>{p.emoji} {p.label}</option>;})}
            </select>
          </div>
          <div className="mrow"><label>Location</label>
            <select value={loc} onChange={function(e){handleLocationChange(e.target.value);}}>
              {locations.map(function(l){return <option key={l} value={l}>{l}</option>;})}
            </select>
          </div>
          <div className="mrow"><label>Category</label>
            <select value={cat} onChange={function(e){setCat(e.target.value);}}>
              {categories.map(function(c){return <option key={c} value={c}>{c}</option>;})}
            </select>
          </div>
          <div className="mrow"><label>Priority</label>
            <select value={prio} onChange={function(e){setPrio(e.target.value);}}>
              {priorities.map(function(p){return <option key={p} value={p}>{p}</option>;})}
            </select>
          </div>
        </div>
        <div className="val-mgmt">
          <div className="val-mgmt-title">Add Custom Values (Optional)</div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--txt2)',marginBottom:4}}>NEW LOCATION {errors.newLoc&&<span style={{color:'var(--high)',fontSize:10}}>⚠ {errors.newLoc}</span>}</div>
            <div className="val-add">
              <input value={newLoc} onChange={function(e){setNewLoc(e.target.value);setErrors(Object.assign({},errors,{newLoc:''}));}} placeholder="Madrid, München, Mannheim, or Cross"/>
              <button className="btn btn-sm btn-p" onClick={addNewLoc} disabled={!newLoc.trim()}>Add</button>
            </div>
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--txt2)',marginBottom:4}}>NEW CATEGORY</div>
            <div className="val-add">
              <input value={newCat} onChange={function(e){setNewCat(e.target.value);}} placeholder="Type new category..."/>
              <button className="btn btn-sm btn-p" onClick={addNewCat} disabled={!newCat.trim()}>Add</button>
            </div>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--txt2)',marginBottom:4}}>NEW PRIORITY</div>
            <div className="val-add">
              <input value={newPri} onChange={function(e){setNewPri(e.target.value);}} placeholder="Type new priority..."/>
              <button className="btn btn-sm btn-p" onClick={addNewPri} disabled={!newPri.trim()}>Add</button>
            </div>
          </div>
        </div>
        <div className="mrow"><label>Structure {errors.mode&&<span style={{color:'var(--high)',marginLeft:'8px'}}>⚠ {errors.mode}</span>}</label></div>
        <div className="mode-grid">
          <div className={`mode-card${mode==='template' ? ' sel' : ''}`} onClick={function(){setMode('template');setErrors(Object.assign({},errors,{mode:''}));}}>
            <div className="mode-icon">T</div>
            <div className="mode-ttl">Use Template</div>
            <div className="mode-desc">All standard sections included.</div>
          </div>
          <div className={`mode-card${mode==='blank' ? ' sel' : ''}`} onClick={function(){setMode('blank');setErrors(Object.assign({},errors,{mode:''}));}}>
            <div className="mode-icon">B</div>
            <div className="mode-ttl">Custom / Blank</div>
            <div className="mode-desc">Choose which sections to include.</div>
          </div>
        </div>
        {mode==='blank'&&(
          <div style={{marginTop:14}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--txt2)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:8}}>Select sections</div>
            <div className="blk-chks">
              {BLK_DEFS.map(function(b){
                return (
                  <label key={b.id} className="blk-chk">
                    <input type="checkbox" checked={selBlocks.indexOf(b.id)>=0} onChange={function(){toggleBlk(b.id);}}/>
                    {b.label}
                  </label>
                );
              })}
            </div>
          </div>
        )}
        <div className="mfoot">
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-p" onClick={create} disabled={!title.trim()||!mode}>Create Project</button>
        </div>
      </div>
    </div>
  );
}

// ── Sidebar ───────────────────────────────────────────────
function Sidebar(props){
  var projects=props.projects; var page=props.page; var setPage=props.setPage;
  var editMode=props.editMode; var onMove=props.onMove; var onNewProject=props.onNewProject; var onLogout=props.onLogout;
  var [open,setOpen]=useState({madrid:true,munchen:true,mannheim:false,cross:false,dev:false});
  function tog(id){setOpen(function(o){var r=Object.assign({},o);r[id]=!r[id];return r;});}
  return (
    <div className="sb">
      <div className="sb-hdr">
        <div className="sb-brand">osapiens</div>
        <div className="sb-title">{props.siteTitle}</div>
        <div className="sb-user">{props.siteName}</div>
      </div>
      <div className="sb-lbl">Overview</div>
      <div className={`sb-row${page==='hub' ? ' active' : ''}`} onClick={function(){setPage('hub');}}>
        <span>📊</span><span className="sb-row-lbl">{props.hubLabel}</span>
        <span className="sb-cnt">{projects.length}</span>
      </div>
      <div className="sb-lbl">Projects</div>
      {PARENTS.map(function(par){
        var subs=projects.filter(function(p){return p.parent===par.id&&!p.archived;});
        return (
          <div key={par.id}>
            <div className="sb-par" onClick={function(){tog(par.id);}}>
              <span>{par.emoji}</span>
              <span className="sb-row-lbl">{par.label}</span>
              <span className="sb-cnt">{subs.length}</span>
              <span className={`sb-chev${open[par.id] ? ' open' : ''}`}>›</span>
            </div>
            {open[par.id]&&subs.map(function(p){
              return (
                <div key={p.id} className={`sb-row sub${page===p.id ? ' active' : ''}`} onClick={function(){setPage(p.id);}} style={{opacity:p.archived?0.5:1}}>
                  <span className="sb-row-lbl" style={{textDecoration:p.archived?'line-through':'none'}}>{p.title} {p.archived&&<span style={{fontSize:9,color:'var(--txt2)'}}>✓</span>}</span>
                  {editMode&&<button className="sb-mv" onClick={function(e){e.stopPropagation();onMove(p.id,'up');}}>↑</button>}
                  {editMode&&<button className="sb-mv" onClick={function(e){e.stopPropagation();onMove(p.id,'down');}}>↓</button>}
                </div>
              );
            })}
          </div>
        );
      })}
      {projects.some(function(p){return p.archived;})&&<div style={{borderTop:'1px solid rgba(255,255,255,.1)',marginTop:12}}>
        <div className="sb-par" onClick={function(){tog('archive');}}>
          <span>📂</span>
          <span className="sb-row-lbl">Archive</span>
          <span className="sb-cnt">{projects.filter(function(p){return p.archived;}).length}</span>
          <span className={`sb-chev${open.archive ? ' open' : ''}`}>›</span>
        </div>
        {open.archive&&projects.filter(function(p){return p.archived;}).map(function(p){
          return (
            <div key={p.id} className={`sb-row sub${page===p.id ? ' active' : ''}`} onClick={function(){setPage(p.id);}}>
              <span className="sb-row-lbl" style={{textDecoration:'line-through',opacity:0.6}}>{p.title}</span>
            </div>
          );
        })}
      </div>}
      <div className="sb-foot">
        <button className="sb-new" onClick={onNewProject}>+ New Project</button>
        <button className="sb-lock" onClick={onLogout}>🔒 Logout</button>
      </div>
    </div>
  );
}

// ── Top bar ────────────────────────────────────────────────
function Topbar(props){
  var page=props.page; var projects=props.projects; var editMode=props.editMode; var setEditMode=props.setEditMode;
  var onSettings=props.onSettings; var onDeleteProject=props.onDeleteProject; var onArchiveProject=props.onArchiveProject;
  var onGlobalValues=props.onGlobalValues;
  var hubView=props.hubView; var setHubView=props.setHubView;
  var filterStatus=props.filterStatus; var setFilterStatus=props.setFilterStatus;
  var filterPriority=props.filterPriority; var setFilterPriority=props.setFilterPriority;
  var sortBy=props.sortBy; var setSortBy=props.setSortBy;
  var current=projects.find(function(p){return p.id===page;});
  var isHub=page==='hub';
  return (
    <div className="topbar">
      <div className="tb-bc">
        {isHub?(
          <span className="tb-cur">📊 {props.hubLabel}</span>
        ):(
          <>
            {current&&<><span className="tb-crumb" onClick={function(){props.setPage('hub');}}>Projects</span><span className="tb-sep"> / </span></>}
            <span className="tb-cur">{current?current.title:'---'}</span>
          </>
        )}
      </div>
      {isHub&&<>
        <select value={filterStatus} onChange={function(e){setFilterStatus(e.target.value);}} className="btn" style={{padding:'6px 10px',fontSize:'12px'}}>
          <option value="all">Status: All</option>
          {S_OPTS.map(function(s){return <option key={s} value={s}>Status: {s}</option>;})}
        </select>
        <select value={filterPriority} onChange={function(e){setFilterPriority(e.target.value);}} className="btn" style={{padding:'6px 10px',fontSize:'12px'}}>
          <option value="all">Priority: All</option>
          {P_OPTS.map(function(p){return <option key={p} value={p}>Priority: {p}</option>;})}
        </select>
        <select value={sortBy} onChange={function(e){setSortBy(e.target.value);}} className="btn" style={{padding:'6px 10px',fontSize:'12px'}}>
          <option value="location">Sort: Location A-Z</option>
          <option value="priority">Sort: Priority (High→Low)</option>
        </select>
        <button className={`btn ${hubView==='grid'?'btn-p':''}`} onClick={function(){setHubView('grid');}}>⊞ Grid</button>
        <button className={`btn ${hubView==='list'?'btn-p':''}`} onClick={function(){setHubView('list');}}>≡ List</button>
      </>}
      {!isHub&&<>
        <button className="btn btn-edit" onClick={function(){setEditMode(!editMode);}}>
          {editMode?'✓ Close':'✏️ Edit'}
        </button>
        {current&&<button className={`btn ${current.archived?'':'btn-p'}`} onClick={function(){props.onArchiveProject(current.id);}}>
          {current.archived?'📂 Restore':'✓ Done'}
        </button>}
        {current&&<button className="btn btn-d" onClick={function(){props.onDeleteProject(current.id);}}>🗑️ Delete</button>}
      </>}
      <button className="btn" onClick={onSettings}>📧 Templates</button>
      <button className="btn" onClick={props.onValuesModal}>📋 Manage</button>
      <button className="btn" onClick={props.onGlobalValues}>🔤 Values</button>
      <button className="btn" onClick={props.onSettings}>⚙️ Site</button>
    </div>
  );
}

// ── Main App ────────────────────────────────────────────────
function App(){
  var [authed,setAuthed]=useState(false);
  var [pw,setPw]=useState('');
  var [projects,setProjects]=useState(loadProjects());
  var [page,setPage]=useState('hub');
  var [editMode,setEditMode]=useState(false);
  var [blockEditId,setBlockEditId]=useState(null);
  var [hubView,setHubView]=useState('grid');
  var [filterStatus,setFilterStatus]=useState('all');
  var [filterPriority,setFilterPriority]=useState('all');
  var [sortBy,setSortBy]=useState('location');
  var [newProjModal,setNewProjModal]=useState(false);
  var [showTemplatesModal,setShowTemplatesModal]=useState(false);
  var [showValuesModal,setShowValuesModal]=useState(false);
  var [showSettingsModal,setShowSettingsModal]=useState(false);
  var [showGlobalValuesModal,setShowGlobalValuesModal]=useState(false);
  var [customParents,setCustomParents]=useState([]);
  var [customCats,setCustomCats]=useState([]);
  var [customPris,setCustomPris]=useState([]);
  var [siteTitle,setSiteTitle]=useState('Workplace Mgmt & Development');
  var [siteName,setSiteName]=useState('Anaïs Amouzou');
  var [hubLabel,setHubLabel]=useState('Project Hub');

  function save(){localStorage.setItem(SK,JSON.stringify(projects));}

  function handleAuth(p){
    if(p==='Workplace2026'){
      setAuthed(true);
      setPw('');
    }else{
      setPw('');
    }
  }

  function addProject(proj){
    var upd=[].concat(projects,[proj]);
    setProjects(upd);
    setNewProjModal(false);
  }

  function updateProject(id,ch){
    var upd=projects.map(function(p){return p.id===id?Object.assign({},p,ch):p;});
    setProjects(upd);
  }

  function moveProject(id,dir){
    var idx=projects.findIndex(function(p){return p.id===id;});
    if((dir==='up'&&idx>0)||(dir==='down'&&idx<projects.length-1)){
      var swapIdx=dir==='up'?idx-1:idx+1;
      var upd=Array.from(projects);
      var tmp=upd[idx];
      upd[idx]=upd[swapIdx];
      upd[swapIdx]=tmp;
      setProjects(upd);
    }
  }

  function deleteProject(id){
    if(window.confirm('Permanently delete this project?')){
      setProjects(projects.filter(function(p){return p.id!==id;}));
      setPage('hub');
    }
  }

  function archiveProject(id){
    var upd=projects.map(function(p){return p.id===id?Object.assign({},p,{archived:!p.archived}):p;});
    setProjects(upd);
  }

  function updateBlock(projId,blkId,ch){
    var upd=projects.map(function(p){
      if(p.id===projId){
        return Object.assign({},p,{blocks:p.blocks.map(function(b){return b.id===blkId?Object.assign({},b,ch):b;})});
      }
      return p;
    });
    setProjects(upd);
  }

  useEffect(function(){save();}, [projects]);

  if(!authed){
    return (
      <div className="pw">
        <div className="pw-card">
          <div className="pw-brand">osapiens</div>
          <div className="pw-title">Workplace M&D Hub</div>
          <div className="pw-sub">Enter password to continue</div>
          <input className="pw-inp" type="password" value={pw} onChange={function(e){setPw(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')handleAuth(pw);}}/>
          <button className="pw-btn" onClick={function(){handleAuth(pw);}}>Access</button>
        </div>
      </div>
    );
  }

  var current=projects.find(function(p){return p.id===page;});

  return (
    <div className="layout">
      <Sidebar projects={projects} page={page} setPage={setPage} editMode={editMode}
        siteTitle={siteTitle} siteName={siteName} hubLabel={hubLabel}
        onMove={moveProject} onNewProject={function(){setNewProjModal(true);}} onLogout={function(){setAuthed(false);}}/>
      <div className="main">
        <Topbar page={page} projects={projects} editMode={editMode} setEditMode={setEditMode}
          hubView={hubView} setHubView={setHubView} hubLabel={hubLabel}
          filterStatus={filterStatus} setFilterStatus={setFilterStatus}
          filterPriority={filterPriority} setFilterPriority={setFilterPriority}
          sortBy={sortBy} setSortBy={setSortBy}
          onSettings={function(){setShowSettingsModal(true);}}
          onDeleteProject={deleteProject}
          onArchiveProject={archiveProject}
          onGlobalValues={function(){setShowGlobalValuesModal(true);}}
          onValuesModal={function(){setShowValuesModal(true);}}
          setPage={setPage}/>
        <div className="content">
          {page==='hub'?(
            function(){
              var filteredProjects=projects.filter(function(p){return !p.archived&&(filterStatus==='all'||p.status===filterStatus)&&(filterPriority==='all'||p.priority===filterPriority);});
              var sortedProjects=filteredProjects.sort(function(a,b){if(sortBy==='priority'){var pri={High:1,Medium:2,Low:3};return (pri[a.priority]||9)-(pri[b.priority]||9);}else{return (a.location||'').localeCompare(b.location||'');}});
              return (
            <div>
              <h2 style={{marginBottom:20}}>All Projects ({sortedProjects.length}/{projects.length})</h2>
              <div className={`hub${hubView==='list' ? ' list' : ''}`}>
                {sortedProjects.map(function(p){
                  return (
                    <div key={p.id} className="proj-card" onClick={function(){setPage(p.id);}}>
                      <div>
                        <div className="proj-title">{p.title}</div>
                        <div className="proj-meta">
                          <SBdg s={p.status}/>
                          <PBdg p={p.priority}/>
                          <LBdg l={p.location}/>
                        </div>
                        {hubView==='grid'&&<div className="proj-desc">{p.overview}</div>}
                        <div style={{fontSize:11,color:'var(--txt2)'}}>{p.category} {p.deadline?'· '+p.deadline:''}</div>
                      </div>
                      {hubView==='list'&&<div style={{fontSize:12,color:'var(--txt2)',whiteSpace:'nowrap',textAlign:'right'}}>{(PARENTS.find(function(x){return x.id===p.parent;})||{emoji:'📍'}).emoji} {p.owner}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
              );
            }()
          ):current?(
            <div>
              <div className="proj-hdr">
                <div className="proj-info">
                  <h2>{current.title} {current.archived&&<span style={{fontSize:14,fontWeight:400,color:'var(--txt2)'}}>✓ Done</span>}</h2>
                  <div className="proj-meta-grid">
                    <div className="meta-item">
                      <div className="meta-label">Status</div>
                      <StatusSel value={current.status} onChange={function(s){updateProject(current.id,{status:s});}}/>
                    </div>
                    <div className="meta-item">
                      <div className="meta-label">Priority</div>
                      <select value={current.priority} onChange={function(e){updateProject(current.id,{priority:e.target.value});}} className="isel">
                        {P_OPTS.map(function(p){return <option key={p} value={p}>{p}</option>;})}
                      </select>
                    </div>
                    <div className="meta-item">
                      <div className="meta-label">Parent</div>
                      {editMode?<select value={current.parent} onChange={function(e){var newParent=e.target.value;var newLoc=getParentLocation(newParent);updateProject(current.id,{parent:newParent,location:newLoc});}}>
                        {PARENTS.map(function(p){return <option key={p.id} value={p.id}>{p.label}</option>;})}
                      </select>:<div className="meta-value">{PARENTS.find(function(p){return p.id===current.parent;}).label}</div>}
                    </div>
                    <div className="meta-item">
                      <div className="meta-label">Location</div>
                      {editMode?<select value={current.location} onChange={function(e){var newLoc=e.target.value;var newParent=getParentByLocation(newLoc);updateProject(current.id,{location:newLoc,parent:newParent});}}>
                        {L_OPTS.map(function(l){return <option key={l} value={l}>{l}</option>;})}
                      </select>:<div className="meta-value"><LBdg l={current.location}/></div>}
                    </div>
                    <div className="meta-item">
                      <div className="meta-label">Category</div>
                      {editMode?<select value={current.category} onChange={function(e){updateProject(current.id,{category:e.target.value});}}>
                        {C_OPTS.map(function(c){return <option key={c} value={c}>{c}</option>;})}
                      </select>:<div className="meta-value">{current.category}</div>}
                    </div>
                    <div className="meta-item">
                      <div className="meta-label">Deadline</div>
                      <div className="date-input-wrapper"><input type="date" value={current.deadline} onChange={function(e){updateProject(current.id,{deadline:e.target.value});}} style={{padding:'6px 8px',fontSize:'12px'}}/></div>
                    </div>
                  </div>
                </div>
              </div>
              {current.blocks.map(function(b,i){
                if(!b.visible&&!editMode&&blockEditId!==b.id)return null;
                var isBlockEditing=editMode||blockEditId===b.id;
                var blkContent=null;
                if(b.id==='overview'){
                  blkContent=isBlockEditing?<textarea value={current.overview} onChange={function(e){updateProject(current.id,{overview:e.target.value});}} style={{width:'100%',minHeight:100}}/>:<div style={{lineHeight:1.6,whiteSpace:'pre-wrap'}}>{current.overview||'No overview'}</div>;
                }else if(b.id==='goals'){
                  blkContent=<GoalList goals={current.goals} editMode={isBlockEditing} onChange={function(g){updateProject(current.id,{goals:g});}} />;
                }else if(b.id==='tasks'){
                  blkContent=<TaskList tasks={current.tasks} editMode={isBlockEditing} onChange={function(t){updateProject(current.id,{tasks:t});}} />;
                }else if(b.id==='team'){
                  blkContent=<TeamList team={current.team} editMode={isBlockEditing} onChange={function(t){updateProject(current.id,{team:t});}} />;
                }else if(b.id==='connections'){
                  blkContent=<ConnEditor connections={current.connections} allProjects={projects} projId={current.id} editMode={isBlockEditing} onChange={function(c){updateProject(current.id,{connections:c});}} setPage={setPage} />;
                }else if(b.id==='notes'){
                  blkContent=isBlockEditing?<textarea value={current.notes} onChange={function(e){updateProject(current.id,{notes:e.target.value});}} style={{width:'100%',minHeight:100}}/>:<div style={{lineHeight:1.6,whiteSpace:'pre-wrap',color:current.notes?'inherit':'var(--txt2)',fontStyle:current.notes?'normal':'italic'}}>{current.notes||'No notes'}</div>;
                }else if(b.id.indexOf('custom')===0){
                  blkContent=isBlockEditing?<textarea value={b.content||''} onChange={function(e){updateBlock(current.id,b.id,{content:e.target.value});}} style={{width:'100%',minHeight:120}} placeholder="Enter custom content..."/>:<div style={{lineHeight:1.6,whiteSpace:'pre-wrap',color:b.content?'inherit':'var(--txt2)',fontStyle:b.content?'normal':'italic'}}>{b.content||'Empty custom block'}</div>;
                }
                return (
                  <BlockShell key={b.id} block={b} editMode={isBlockEditing} isBlockLevelEdit={blockEditId===b.id&&!editMode}
                    onMoveUp={function(){updateBlock(current.id,b.id,{order:(b.order||0)-1});}}
                    onMoveDown={function(){updateBlock(current.id,b.id,{order:(b.order||0)+1});}}
                    onToggle={function(){updateBlock(current.id,b.id,{visible:!b.visible});}}
                    onEnterEditMode={function(){setEditMode(true);}}
                    onEnterBlockEditMode={function(){setBlockEditId(b.id);}}
                    onExitBlockEditMode={function(){setBlockEditId(null);}}
                    isFirst={i===0} isLast={i===current.blocks.length-1}>
                    {blkContent}
                  </BlockShell>
                );
              })}
              {editMode&&<div style={{marginTop:20,padding:16,background:'var(--g0)',border:'2px dashed var(--g2)',borderRadius:10,textAlign:'center'}}>
                <button className="btn btn-p" onClick={function(){
                  var customBlk={id:'custom-'+Date.now(),label:'📝 Custom Block',visible:true,content:''};
                  updateBlock(current.id,customBlk.id,customBlk);
                  var newBlocks=[].concat(current.blocks,[customBlk]);
                  updateProject(current.id,{blocks:newBlocks});
                }}>+ Add Free Text Block</button>
              </div>}
            </div>
          ):null}
        </div>
      </div>
      {newProjModal&&<NewProjectModal allProjects={projects} onClose={function(){setNewProjModal(false);}} onCreate={addProject}
        customParents={customParents} setCustomParents={setCustomParents}
        customCats={customCats} setCustomCats={setCustomCats}
        customPris={customPris} setCustomPris={setCustomPris}/>}
      {showTemplatesModal&&<EmailTemplatesModal onClose={function(){setShowTemplatesModal(false);}}/>}
      {showValuesModal&&<ValuesModal onClose={function(){setShowValuesModal(false);}} projects={projects}
        customCats={customCats} setCustomCats={setCustomCats}
        customPris={customPris} setCustomPris={setCustomPris}
        customLocs={customParents.map(function(p){return p.location;})}
        setCustomLocs={function(locs){var newParents=customParents.filter(function(p){return locs.indexOf(p.location)>=0;});setCustomParents(newParents);}}/>}
      {showSettingsModal&&<SettingsModal onClose={function(){setShowSettingsModal(false);}}
        siteTitle={siteTitle} setSiteTitle={setSiteTitle}
        siteName={siteName} setSiteName={setSiteName}
        hubLabel={hubLabel} setHubLabel={setHubLabel}/>}
      {showGlobalValuesModal&&<GlobalValuesModal onClose={function(){setShowGlobalValuesModal(false);}}
        customParents={customParents} setCustomParents={setCustomParents}/>}
    </div>
  );
}

ReactDOM.render(
  <ErrorBoundary><App/></ErrorBoundary>,
  document.getElementById('app')
);
</script>
</body>
</html>
