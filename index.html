<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>osapiens · Workplace M&D (Supabase Edition)</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --g9:#064E3B;--g8:#065F46;--g7:#047857;--g6:#059669;--g5:#10B981;
  --g2:#A7F3D0;--g1:#D1FAE5;--g0:#ECFDF5;
  --border:#e5e5ea;--bg:#f5f5f7;--card:#fff;--txt:#1d1d1f;--txt2:#636366;
  --r:10px;--sh:0 1px 4px rgba(0,0,0,.08);
  --high:#C0392B;--hbg:#FFE8E8;--med:#9C6B00;--mbg:#FFF2CC;--low:#375623;--lbg:#E2EFDA;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--txt);}
button{cursor:pointer;font-family:inherit;}
input,textarea,select{font-family:inherit;}

/* Error & Loading */
.err-screen{padding:40px;max-width:700px;margin:40px auto;}
.err-screen h2{color:var(--high);margin-bottom:12px;}
.err-screen pre{background:#f5f5f7;border:1px solid var(--border);border-radius:8px;padding:16px;font-size:12px;overflow:auto;white-space:pre-wrap;}
.loading{display:flex;align-items:center;justify-content:center;height:100vh;font-size:14px;color:var(--txt2);}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--g7);border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Auth Flow */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--g9);}
.auth-card{background:#fff;border-radius:16px;padding:40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.auth-brand{font-size:11px;font-weight:800;color:var(--g7);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.auth-title{font-size:22px;font-weight:700;margin-bottom:20px;}
.auth-sub{font-size:13px;color:var(--txt2);margin-bottom:20px;}
.auth-field{margin-bottom:16px;}
.auth-label{display:block;font-size:12px;font-weight:600;color:var(--txt);margin-bottom:6px;}
.auth-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;}
.auth-input:focus{border-color:var(--g5);box-shadow:0 0 0 2px var(--g0);}
.auth-btn{width:100%;background:var(--g7);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;}
.auth-btn:hover{background:var(--g8);}
.auth-err{background:var(--hbg);color:var(--high);border:1px solid #f5a5a5;border-radius:6px;padding:10px 12px;font-size:12px;margin-bottom:12px;}
.auth-link{font-size:12px;text-align:center;margin-top:12px;color:var(--txt2);}
.auth-link a{color:var(--g7);text-decoration:none;cursor:pointer;}
.auth-link a:hover{text-decoration:underline;}

/* Layout */
.layout{display:flex;height:100vh;overflow:hidden;}
.sb{width:250px;background:var(--g9);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0;}
.content{flex:1;overflow-y:auto;padding:28px 32px;}

/* Sidebar */
.sb-hdr{padding:16px;border-bottom:1px solid rgba(255,255,255,.1);}
.sb-brand{font-size:11px;font-weight:800;color:var(--g2);letter-spacing:1.5px;text-transform:uppercase;}
.sb-title{font-size:13px;font-weight:700;color:#fff;margin-top:3px;line-height:1.3;}
.sb-user{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.sb-status{font-size:10px;color:rgba(255,255,255,.35);margin-top:4px;display:flex;align-items:center;gap:4px;}
.sb-status.live{color:#4ade80;}
.sb-status.offline{color:#f87171;}
.sb-lbl{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.8px;padding:12px 16px 4px;}
.sb-row{display:flex;align-items:center;padding:7px 16px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.75);gap:7px;transition:background .12s;}
.sb-row:hover{background:rgba(255,255,255,.08);}
.sb-row.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600;}
.sb-row.sub{padding-left:28px;font-size:12.5px;}
.sb-row-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-cnt{background:rgba(255,255,255,.12);border-radius:10px;font-size:10px;padding:1px 6px;color:rgba(255,255,255,.6);}
.sb-mv{border:none;background:none;color:rgba(255,255,255,.3);font-size:11px;padding:1px 3px;line-height:1;flex-shrink:0;cursor:pointer;}
.sb-mv:hover{color:rgba(255,255,255,.8);}
.sb-new{display:flex;align-items:center;justify-content:center;gap:5px;margin:8px 16px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border:1px dashed rgba(255,255,255,.25);border-radius:8px;padding:7px;font-size:12px;font-weight:600;cursor:pointer;}
.sb-new:hover{background:rgba(255,255,255,.18);color:#fff;}
.sb-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);margin-top:auto;display:flex;gap:8px;}
.sb-btn{flex:1;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);border:none;border-radius:6px;padding:6px;font-size:11px;cursor:pointer;}
.sb-btn:hover{background:rgba(255,255,255,.15);color:#fff;}

/* Topbar */
.tb-bc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt2);flex:1;min-width:0;}
.tb-crumb{cursor:pointer;white-space:nowrap;}
.tb-crumb:hover{color:var(--g7);text-decoration:underline;}
.tb-cur{color:var(--txt);font-weight:600;cursor:default;}
.tb-sep{color:var(--border);}
.tb-icons{display:flex;gap:8px;align-items:center;}
.tb-icon{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;background:#fff;transition:all .12s;}
.tb-icon:hover{background:var(--bg);border-color:var(--g5);}
.tb-icon.active{background:var(--g0);border-color:var(--g5);color:var(--g7);}

/* Buttons */
.btn{border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;background:#fff;color:var(--txt);cursor:pointer;}
.btn:hover{border-color:var(--g6);color:var(--g7);}
.btn-p{background:var(--g7);color:#fff;border-color:var(--g7);}
.btn-p:hover{background:var(--g8);}
.btn-sm{padding:4px 8px;font-size:11px;}
.btn-d{border-color:#fca5a5;color:var(--high);background:#fff;}
.btn-d:hover{background:var(--hbg);}

/* Badges */
.bdg{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.b-high{background:var(--hbg);color:var(--high);}
.b-med{background:var(--mbg);color:var(--med);}
.b-low{background:var(--lbg);color:var(--low);}
.b-ip{background:#EAF4FF;color:#007AFF;}
.b-done{background:#E8F8EF;color:#1A7F3C;}
.b-ns{background:#F5F5F7;color:#636366;}

/* Hub table */
.hub-tbl{width:100%;border-collapse:collapse;}
.hub-tbl th{text-align:left;padding:12px;font-size:11px;font-weight:700;background:var(--bg);border-bottom:1px solid var(--border);color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;}
.hub-tbl td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;}
.hub-tbl tr:hover{background:var(--bg);}
.hub-tbl-exp{cursor:pointer;user-select:none;font-weight:600;}
.hub-tbl-exp:hover{color:var(--g7);}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:#fff;border-radius:12px;padding:32px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-title{font-size:18px;font-weight:700;margin-bottom:20px;}
.modal-field{margin-bottom:16px;}
.modal-label{display:block;font-size:12px;font-weight:600;color:var(--txt);margin-bottom:6px;}
.modal-input,.modal-select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;outline:none;}
.modal-input:focus,.modal-select:focus{border-color:var(--g5);box-shadow:0 0 0 2px var(--g0);}
.modal-btns{display:flex;gap:8px;margin-top:24px;justify-content:flex-end;}

/* Project detail */
.proj-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;}
.proj-ttl{font-size:28px;font-weight:700;margin-bottom:8px;}
.proj-meta{display:flex;gap:12px;flex-wrap:wrap;}
.proj-blks{display:flex;flex-direction:column;gap:24px;}
.blk{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;}
.blk-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.blk-ttl{font-size:15px;font-weight:700;color:var(--txt);}
.blk-content{font-size:13px;line-height:1.6;color:var(--txt);}
.blk-lst{list-style:none;padding:0;}
.blk-lst li{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.blk-lst li:last-child{border-bottom:none;}
.blk-task{display:flex;align-items:center;gap:12px;padding:8px;background:var(--bg);border-radius:6px;margin-bottom:8px;}
.blk-task input[type="checkbox"]{cursor:pointer;}

/* Sync indicator */
.sync-ind{font-size:11px;color:var(--txt2);display:flex;align-items:center;gap:4px;}
.sync-ind.syncing{color:#f59e0b;}
.sync-ind.synced{color:var(--g5)}
</style>
</head>
<body>

<div id="app"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ============ ERROR BOUNDARY ============
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      return (
        React.createElement("div", { className: "err-screen" },
          React.createElement("h2", null, "Error"),
          React.createElement("pre", null, this.state.error.toString())
        )
      );
    }
    return this.props.children;
  }
}

// ============ SUPABASE CONFIG ============
// CONFIGURE THESE with your Supabase credentials
const SUPABASE_URL = "https://metlliqfmnhblmlmyxus.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ee7qOGLE7TRaLXn_0kv7RQ_1MsXamPG";

// Placeholder for Supabase client (will be initialized if credentials provided)
let supabaseClient = null;
let supabaseReady = false;

function initSupabase() {
  if (SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY") {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    supabaseReady = true;
    return true;
  }
  return false;
}

// ============ MAIN APP ============
function App() {
  const [auth, setAuth] = useState(null);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("hub");
  const [selectedProject, setSelectedProject] = useState(null);
  const [projects, setProjects] = useState([]);
  const [syncStatus, setSyncStatus] = useState("offline");
  const [authTab, setAuthTab] = useState("signin");

  // Initialize
  useEffect(function() {
    const init = function() {
      const isSupabaseOk = initSupabase();

      if (isSupabaseOk) {
        // Check existing session
        supabaseClient.auth.getSession().then(function(result) {
          const data = result.data;
          if (data.session) {
            setAuth(data.session);
            loadProjects(data.session);
            subscribeToChanges();
            setSyncStatus("live");
          } else {
            setLoading(false);
          }
        });
      } else {
        // Fallback to localStorage
        const stored = localStorage.getItem("wmd-v4");
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            setProjects(parsed.projects || []);
            setAuth({ offline: true });
          } catch (e) {
            console.error("Failed to parse localStorage", e);
          }
        }
        setLoading(false);
        setSyncStatus("offline");
      }
    };

    init();
  }, []);

  function loadProjects(session) {
    if (!supabaseClient) return;

    supabaseClient
      .from("projects")
      .select("*")
      .then(function(result) {
        if (result.error) {
          console.error("Failed to load projects", result.error);
          return;
        }
        setProjects(result.data || []);
        setLoading(false);
      });
  }

  function subscribeToChanges() {
    if (!supabaseClient) return;

    supabaseClient
      .channel("projects-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "projects" }, function(payload) {
        setSyncStatus("syncing");
        // Reload projects
        loadProjects(auth);
        setTimeout(function() {
          setSyncStatus("live");
        }, 500);
      })
      .subscribe();
  }

  function handleLogout() {
    if (supabaseClient) {
      supabaseClient.auth.signOut().then(function() {
        setAuth(null);
        setProjects([]);
      });
    } else {
      setAuth(null);
      setProjects([]);
      localStorage.removeItem("wmd-v4");
    }
  }

  // Auth screen
  if (!auth) {
    return React.createElement(AuthScreen, {
      onAuth: function(session) {
        setAuth(session);
        if (session.user) {
          loadProjects(session);
          subscribeToChanges();
          setSyncStatus("live");
        }
      }
    });
  }

  if (loading) {
    return React.createElement("div", { className: "loading" },
      React.createElement("span", { className: "spinner" }),
      React.createElement("span", null, "Loading projects...")
    );
  }

  // Main layout
  return React.createElement("div", { className: "layout" },
    React.createElement(Sidebar, {
      projects: projects,
      view: view,
      selectedProject: selectedProject,
      onViewChange: setView,
      onSelectProject: setSelectedProject,
      onLogout: handleLogout,
      syncStatus: syncStatus
    }),
    React.createElement("div", { className: "main" },
      React.createElement(Topbar, { view: view, syncStatus: syncStatus }),
      React.createElement("div", { className: "content" },
        view === "hub" && React.createElement(HubView, { projects: projects }),
        view === "project" && selectedProject && React.createElement(ProjectDetail, { project: selectedProject, projects: projects })
      )
    )
  );
}

// ============ AUTH SCREEN ============
function AuthScreen(props) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  function handleSignIn() {
    setLoading(true);
    setError("");

    if (!supabaseClient) {
      setError("Supabase not configured. Using offline mode.");
      props.onAuth({ offline: true });
      setLoading(false);
      return;
    }

    supabaseClient.auth.signInWithPassword({ email: email, password: password })
      .then(function(result) {
        if (result.error) {
          setError(result.error.message);
        } else {
          props.onAuth(result.data.session);
        }
      })
      .finally(function() {
        setLoading(false);
      });
  }

  function handleSignUp() {
    setLoading(true);
    setError("");

    if (!supabaseClient) {
      setError("Supabase not configured. Please contact admin.");
      setLoading(false);
      return;
    }

    supabaseClient.auth.signUp({ email: email, password: password })
      .then(function(result) {
        if (result.error) {
          setError(result.error.message);
        } else {
          setError("Check your email for confirmation!");
        }
      })
      .finally(function() {
        setLoading(false);
      });
  }

  return React.createElement("div", { className: "auth-screen" },
    React.createElement("div", { className: "auth-card" },
      React.createElement("div", { className: "auth-brand" }, "osapiens"),
      React.createElement("div", { className: "auth-title" }, "Workplace M&D"),
      error && React.createElement("div", { className: "auth-err" }, error),
      React.createElement("div", { className: "auth-field" },
        React.createElement("label", { className: "auth-label" }, "Email"),
        React.createElement("input", {
          className: "auth-input",
          type: "email",
          value: email,
          onChange: function(e) { setEmail(e.target.value); },
          placeholder: "your@email.com"
        })
      ),
      React.createElement("div", { className: "auth-field" },
        React.createElement("label", { className: "auth-label" }, "Password"),
        React.createElement("input", {
          className: "auth-input",
          type: "password",
          value: password,
          onChange: function(e) { setPassword(e.target.value); },
          placeholder: "••••••••"
        })
      ),
      React.createElement("button", {
        className: "auth-btn",
        onClick: handleSignIn,
        disabled: loading
      }, loading ? "Loading..." : "Sign In"),
      React.createElement("div", { className: "auth-link" },
        "Don't have an account? ",
        React.createElement("a", { onClick: handleSignUp }, "Sign Up")
      ),
      React.createElement("div", { className: "auth-link", style: { marginTop: "20px", paddingTop: "20px", borderTop: "1px solid var(--border)" } },
        "Or ",
        React.createElement("a", { onClick: function() { props.onAuth({ offline: true }); } }, "continue offline")
      )
    )
  );
}

// ============ SIDEBAR ============
function Sidebar(props) {
  return React.createElement("div", { className: "sb" },
    React.createElement("div", { className: "sb-hdr" },
      React.createElement("div", { className: "sb-brand" }, "Workplace M&D"),
      React.createElement("div", { className: "sb-title" }, "Hub"),
      React.createElement("div", { className: "sb-user" }, "Anaïs"),
      React.createElement("div", { className: "sb-status " + (props.syncStatus === "live" ? "live" : "offline") },
        React.createElement("span", { style: { display: "inline-block", width: "4px", height: "4px", borderRadius: "50%", backgroundColor: "currentColor" } }),
        props.syncStatus === "live" ? "Real-time" : "Offline"
      )
    ),
    React.createElement("div", { className: "sb-lbl" }, "Views"),
    React.createElement("div", {
      className: "sb-row " + (props.view === "hub" ? "active" : ""),
      onClick: function() { props.onViewChange("hub"); }
    }, "📊 Hub"),
    React.createElement("div", { className: "sb-lbl", style: { marginTop: "12px" } }, "Projects"),
    props.projects.filter(function(p) { return !p.parent_id; }).map(function(p) {
      return React.createElement("div", { key: p.id },
        React.createElement("div", {
          className: "sb-row " + (props.selectedProject && props.selectedProject.id === p.id ? "active" : ""),
          onClick: function() { props.selectedProject = p; props.onSelectProject(p); props.onViewChange("project"); }
        },
          p.title,
          React.createElement("span", { className: "sb-cnt" }, props.projects.filter(function(c) { return c.parent_id === p.id; }).length)
        )
      );
    }),
    React.createElement("button", { className: "sb-new" }, "+ New Project"),
    React.createElement("div", { className: "sb-foot" },
      React.createElement("button", { className: "sb-btn", onClick: props.onLogout }, "Logout")
    )
  );
}

// ============ TOPBAR ============
function Topbar(props) {
  return React.createElement("div", { className: "topbar" },
    React.createElement("div", { className: "tb-bc" },
      props.view === "hub" && React.createElement("span", null, "All Projects"),
      props.view === "project" && React.createElement("span", null, "Project Detail")
    ),
    React.createElement("div", { className: "sync-ind " + (props.syncStatus === "live" ? "synced" : "syncing") },
      props.syncStatus === "live" && React.createElement("span", null, "✓ Synced"),
      props.syncStatus === "syncing" && React.createElement("span", null, "◌ Syncing..."),
      props.syncStatus === "offline" && React.createElement("span", null, "◇ Offline")
    )
  );
}

// ============ HUB VIEW ============
function HubView(props) {
  return React.createElement("div", null,
    React.createElement("h1", { style: { fontSize: "24px", fontWeight: "700", marginBottom: "20px" } }, "All Projects"),
    React.createElement("table", { className: "hub-tbl" },
      React.createElement("thead", null,
        React.createElement("tr", null,
          React.createElement("th", null, "Title"),
          React.createElement("th", null, "Location"),
          React.createElement("th", null, "Owner"),
          React.createElement("th", null, "Priority"),
          React.createElement("th", null, "Status"),
          React.createElement("th", null, "Deadline")
        )
      ),
      React.createElement("tbody", null,
        props.projects.filter(function(p) { return !p.parent_id; }).map(function(p) {
          return React.createElement("tr", { key: p.id },
            React.createElement("td", null, p.title),
            React.createElement("td", null, p.location),
            React.createElement("td", null, p.owner_id || "—"),
            React.createElement("td", null,
              React.createElement("span", { className: "bdg b-" + (p.priority === "Hoch" ? "high" : p.priority === "Mittel" ? "med" : "low") },
                p.priority
              )
            ),
            React.createElement("td", null,
              React.createElement("span", { className: "bdg b-" + (p.status === "Done" ? "done" : p.status === "In Bearbeitung" ? "ip" : "ns") },
                p.status
              )
            ),
            React.createElement("td", null, p.deadline || "—")
          );
        })
      )
    )
  );
}

// ============ PROJECT DETAIL ============
function ProjectDetail(props) {
  return React.createElement("div", null,
    React.createElement("div", { className: "proj-hdr" },
      React.createElement("div", null,
        React.createElement("h1", { className: "proj-ttl" }, props.project.title),
        React.createElement("div", { className: "proj-meta" },
          React.createElement("span", { className: "bdg b-" + (props.project.priority === "Hoch" ? "high" : props.project.priority === "Mittel" ? "med" : "low") }, props.project.priority),
          React.createElement("span", { className: "bdg b-" + (props.project.status === "Done" ? "done" : props.project.status === "In Bearbeitung" ? "ip" : "ns") }, props.project.status)
        )
      )
    ),
    React.createElement("div", { className: "proj-blks" },
      React.createElement("div", { className: "blk" },
        React.createElement("div", { className: "blk-hdr" },
          React.createElement("div", { className: "blk-ttl" }, "Overview")
        ),
        React.createElement("div", { className: "blk-content" }, props.project.description || "No description yet.")
      )
    )
  );
}

// ============ RENDER ============
ReactDOM.render(
  React.createElement(ErrorBoundary, null,
    React.createElement(App, null)
  ),
  document.getElementById("app")
);
</script>
